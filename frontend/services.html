<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Majdoors | Service Professionals — Book Verified Workers</title>
<meta name="description" content="Find and book verified construction workers near you. Electricians, plumbers, carpenters, painters, and more.">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:'#0a2540',orange:'#f97316',lightgray:'#f3f4f6'},fontFamily:{sans:['Inter','system-ui','sans-serif']},animation:{float:'float 5s ease-in-out infinite','fade-up':'fadeUp 0.6s ease-out','pulse-green':'pulseGreen 2s infinite','slide-in-right':'slideInRight 0.3s ease-out','slide-in-up':'slideInUp 0.4s ease-out','bounce-in':'bounceIn 0.5s ease-out','shimmer':'shimmer 2s infinite'},keyframes:{float:{'0%,100%':{transform:'translateY(0px)'},'50%':{transform:'translateY(-12px)'}},fadeUp:{'0%':{opacity:'0',transform:'translateY(20px)'},'100%':{opacity:'1',transform:'translateY(0)'}},pulseGreen:{'0%,100%':{boxShadow:'0 0 0 0 rgba(34,197,94,0.7)'},'70%':{boxShadow:'0 0 0 10px rgba(34,197,94,0)'}},slideInRight:{'0%':{transform:'translateX(100%)',opacity:'0'},'100%':{transform:'translateX(0)',opacity:'1'}},slideInUp:{'0%':{transform:'translateY(30px)',opacity:'0'},'100%':{transform:'translateY(0)',opacity:'1'}},bounceIn:{'0%':{transform:'scale(0.3)',opacity:'0'},'50%':{transform:'scale(1.05)'},'100%':{transform:'scale(1)',opacity:'1'}},shimmer:{'0%':{backgroundPosition:'-200% 0'},'100%':{backgroundPosition:'200% 0'}}}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-gray-800 font-sans selection:bg-orange selection:text-white" style="display:none">
    <div id="navbar-container"></div>
    <div id="modals-container"></div>
    <main class="pt-16 max-w-7xl mx-auto px-6 py-8" data-page="services">

<a href="index.html" class="text-orange font-semibold flex items-center gap-2 mb-6 hover:gap-3 transition-all no-underline"><i class="fas fa-arrow-left"></i> Back to Home</a>

<div class="flex flex-wrap justify-between items-center gap-4 mb-6">
<div><h1 class="text-3xl font-extrabold"><i class="fas fa-hard-hat text-orange"></i> Service Professionals</h1><p class="text-gray-500 mt-1">Find & book verified workers near you</p></div>
<div class="flex flex-wrap gap-3">
<input type="text" id="workerSearch" placeholder="Search by name..." class="border border-gray-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-orange-400 w-48" oninput="filterWorkers()">
<select id="cityFilter" class="border border-gray-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-orange-400" onchange="filterWorkers()"><option value="">All Cities</option><option>Bihar Sharif</option><option>Patna</option><option>Delhi</option><option>Mumbai</option></select>
<select id="serviceTypeFilter" class="border border-gray-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-orange-400" onchange="filterWorkers()"><option value="">All Services</option><option>Electrician</option><option>Plumber</option><option>Home Cleaning</option><option>Carpenter</option><option>Painter</option><option>Home Installation</option><option>Mason</option><option>AC Technician</option></select>
<select id="availFilter" class="border border-gray-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-orange-400" onchange="filterWorkers()"><option value="">All Status</option><option value="Available">Available</option><option value="Busy">Busy</option></select>
</div>
</div>

<div class="grid md:grid-cols-3 gap-6" id="servicesWorkerGrid"></div>

    </main>
    <div id="footer-container"></div>
    <script src="js/api.js?v=15"></script>
    <script src="js/main.js?v=15"></script>
    <script src="js/app.js?v=15"></script>
    <script src="js/pages.js?v=15"></script>
</body>
</html>
