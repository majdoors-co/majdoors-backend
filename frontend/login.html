<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Majdoors | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:'#0a2540',orange:'#f97316'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 text-gray-800" style="display:none">
<div id="navbar-container"></div>
<div id="modals-container"></div>
<main class="pt-16 min-h-screen flex items-center justify-center px-4" data-page="login">
<div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-gray-100">
<div class="text-center mb-6"><i class="fas fa-hard-hat text-4xl text-orange-500 mb-2"></i><h1 class="text-2xl font-extrabold text-navy">Welcome Back</h1><p class="text-gray-500 text-sm mt-1">Login to access bookings & orders</p></div>
<div class="space-y-4">
<div><label class="text-sm font-medium text-gray-600">Email</label><input type="text" id="loginEmailPage" placeholder="Enter email" class="w-full border border-gray-200 rounded-xl py-3 px-4 mt-1 focus:outline-none focus:border-orange-400"></div>
<div><label class="text-sm font-medium text-gray-600">Password</label><input type="password" id="loginPasswordPage" placeholder="Enter password" class="w-full border border-gray-200 rounded-xl py-3 px-4 mt-1 focus:outline-none focus:border-orange-400"></div>
<button onclick="handleLoginPage()" class="btn-primary w-full py-3 text-lg">Login</button>
<a href="index.html" class="block w-full text-center text-orange font-semibold hover:underline py-2">Continue as Guest &rarr;</a>
</div>
<p class="text-center text-sm text-gray-500 mt-4">Don't have an account? <a href="register.html" class="text-orange font-semibold">Register</a></p>
</div>
</main>
<script src="js/api.js?v=15"></script>
<script src="js/main.js?v=15"></script>
<script src="js/app.js?v=15"></script>
    <script src="js/pages.js?v=15"></script>
</body>
</html>
