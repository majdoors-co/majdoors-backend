<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Majdoors | My Account</title>
<meta name="description" content="Manage your Majdoors account, orders, bookings and wishlist.">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:'#0a2540',orange:'#f97316',lightgray:'#f3f4f6'},fontFamily:{sans:['Inter','system-ui','sans-serif']},animation:{float:'float 5s ease-in-out infinite','fade-up':'fadeUp 0.6s ease-out','pulse-green':'pulseGreen 2s infinite','slide-in-right':'slideInRight 0.3s ease-out','slide-in-up':'slideInUp 0.4s ease-out','bounce-in':'bounceIn 0.5s ease-out','shimmer':'shimmer 2s infinite'},keyframes:{float:{'0%,100%':{transform:'translateY(0px)'},'50%':{transform:'translateY(-12px)'}},fadeUp:{'0%':{opacity:'0',transform:'translateY(20px)'},'100%':{opacity:'1',transform:'translateY(0)'}},pulseGreen:{'0%,100%':{boxShadow:'0 0 0 0 rgba(34,197,94,0.7)'},'70%':{boxShadow:'0 0 0 10px rgba(34,197,94,0)'}},slideInRight:{'0%':{transform:'translateX(100%)',opacity:'0'},'100%':{transform:'translateX(0)',opacity:'1'}},slideInUp:{'0%':{transform:'translateY(30px)',opacity:'0'},'100%':{transform:'translateY(0)',opacity:'1'}},bounceIn:{'0%':{transform:'scale(0.3)',opacity:'0'},'50%':{transform:'scale(1.05)'},'100%':{transform:'scale(1)',opacity:'1'}},shimmer:{'0%':{backgroundPosition:'-200% 0'},'100%':{backgroundPosition:'200% 0'}}}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-gray-800 font-sans selection:bg-orange selection:text-white" style="display:none">
    <div id="navbar-container"></div>
    <div id="modals-container"></div>
    <main class="pt-16 max-w-4xl mx-auto px-6 py-8" data-page="account">

<h1 class="text-3xl font-extrabold mb-8"><i class="fas fa-user text-orange"></i> My Account</h1>

<div class="grid md:grid-cols-3 gap-6">
<div class="md:col-span-1 space-y-3">
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 text-center"><div class="w-20 h-20 bg-orange-50 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fas fa-user text-3xl text-orange"></i></div><p class="font-bold" id="accName">Guest</p><p class="text-sm text-gray-500" id="accEmail">-</p></div>
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 space-y-1">
<a href="orders.html" class="block py-2.5 px-3 rounded-xl hover:bg-orange-50 text-sm font-medium transition no-underline text-gray-700"><i class="fas fa-box w-5 text-orange"></i> My Orders</a>
<a href="bookings.html" class="block py-2.5 px-3 rounded-xl hover:bg-orange-50 text-sm font-medium transition no-underline text-gray-700"><i class="fas fa-calendar-check w-5 text-orange"></i> My Bookings</a>
<a href="#" class="block py-2.5 px-3 rounded-xl hover:bg-orange-50 text-sm font-medium transition no-underline text-gray-700"><i class="fas fa-heart w-5 text-red-500"></i> Wishlist</a>
<a href="#" class="block py-2.5 px-3 rounded-xl hover:bg-orange-50 text-sm font-medium transition no-underline text-gray-700"><i class="fas fa-map-marker-alt w-5 text-orange"></i> Addresses</a>
<a href="#" onclick="logout()" class="block py-2.5 px-3 rounded-xl hover:bg-red-50 text-sm font-medium text-red-500 transition no-underline"><i class="fas fa-sign-out-alt w-5"></i> Logout</a>
</div>
</div>

<div class="md:col-span-2 space-y-6">
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><h3 class="font-bold mb-4"><i class="fas fa-box text-orange"></i> Recent Orders</h3><div id="accountOrders" class="space-y-3"><p class="text-gray-400 text-sm text-center py-6">No orders yet. <a href="mart.html" class="text-orange font-semibold">Start shopping!</a></p></div></div>
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><h3 class="font-bold mb-4"><i class="fas fa-calendar-check text-orange"></i> My Bookings</h3><div id="accountBookings" class="space-y-3"><p class="text-gray-400 text-sm text-center py-6">No bookings yet. <a href="services.html" class="text-orange font-semibold">Book a service!</a></p></div></div>
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6"><h3 class="font-bold mb-4"><i class="fas fa-heart text-red-500"></i> Wishlist</h3><div id="accountWishlist" class="grid grid-cols-2 gap-3"><p class="text-gray-400 text-sm text-center py-6 col-span-2">Your wishlist is empty</p></div></div>
</div>
</div>

    </main>
    <div id="footer-container"></div>
    <script src="js/api.js?v=23"></script>
    <script src="js/main.js?v=23"></script>
    <script src="js/app.js?v=23"></script>
    <script src="js/pages.js?v=23"></script>
</body>
</html>
