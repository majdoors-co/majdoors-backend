<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Majdoors | Contact Us</title>
<meta name="description" content="Contact Majdoors - India's #1 construction services marketplace. Get in touch for any queries.">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{navy:'#0a2540',orange:'#f97316',lightgray:'#f3f4f6'},fontFamily:{sans:['Inter','system-ui','sans-serif']},animation:{float:'float 5s ease-in-out infinite','fade-up':'fadeUp 0.6s ease-out','pulse-green':'pulseGreen 2s infinite','slide-in-right':'slideInRight 0.3s ease-out','slide-in-up':'slideInUp 0.4s ease-out','bounce-in':'bounceIn 0.5s ease-out','shimmer':'shimmer 2s infinite'},keyframes:{float:{'0%,100%':{transform:'translateY(0px)'},'50%':{transform:'translateY(-12px)'}},fadeUp:{'0%':{opacity:'0',transform:'translateY(20px)'},'100%':{opacity:'1',transform:'translateY(0)'}},pulseGreen:{'0%,100%':{boxShadow:'0 0 0 0 rgba(34,197,94,0.7)'},'70%':{boxShadow:'0 0 0 10px rgba(34,197,94,0)'}},slideInRight:{'0%':{transform:'translateX(100%)',opacity:'0'},'100%':{transform:'translateX(0)',opacity:'1'}},slideInUp:{'0%':{transform:'translateY(30px)',opacity:'0'},'100%':{transform:'translateY(0)',opacity:'1'}},bounceIn:{'0%':{transform:'scale(0.3)',opacity:'0'},'50%':{transform:'scale(1.05)'},'100%':{transform:'scale(1)',opacity:'1'}},shimmer:{'0%':{backgroundPosition:'-200% 0'},'100%':{backgroundPosition:'200% 0'}}}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-gray-800 font-sans selection:bg-orange selection:text-white" style="display:none">
    <div id="navbar-container"></div>
    <div id="modals-container"></div>
    <main class="pt-16" data-page="contact">

<!-- Contact Hero -->
<section class="hero-bg text-white py-16 md:py-20 px-6 text-center relative overflow-hidden">
<div class="max-w-3xl mx-auto relative z-10">
<h1 class="text-4xl md:text-5xl font-extrabold">Get in <span class="text-orange">Touch</span></h1>
<p class="text-lg mt-4 text-gray-300">Have questions? We'd love to hear from you.</p>
</div>
</section>

<div class="max-w-5xl mx-auto px-6 py-16">
<div class="grid md:grid-cols-2 gap-12">
<!-- Contact Form -->
<div>
<h2 class="text-2xl font-bold mb-6"><i class="fas fa-envelope text-orange"></i> Send us a Message</h2>
<form id="contactForm" class="space-y-4" onsubmit="event.preventDefault();submitContactForm()">
<input type="text" id="contactName" placeholder="Full Name" required class="w-full border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100">
<input type="email" id="contactEmail" placeholder="Email Address" required class="w-full border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100">
<input type="tel" id="contactPhone" placeholder="Phone Number" class="w-full border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100">
<select id="contactSubject" class="w-full border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-orange-400">
<option value="">Select Subject</option>
<option>Service Inquiry</option>
<option>Product Inquiry</option>
<option>Order Issue</option>
<option>Booking Issue</option>
<option>Partnership</option>
<option>Other</option>
</select>
<textarea id="contactMessage" placeholder="Your Message" rows="5" required class="w-full border border-gray-200 rounded-xl py-3 px-4 focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 resize-none"></textarea>
<button type="submit" id="contactSubmitBtn" class="btn-primary w-full py-3 text-lg">Send Message</button>
</form>
</div>

<!-- Contact Info -->
<div class="space-y-6">
<h2 class="text-2xl font-bold mb-6"><i class="fas fa-map-marker-alt text-orange"></i> Contact Info</h2>
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex items-start gap-4 hover:shadow-md transition">
<div class="w-12 h-12 bg-orange-50 rounded-xl flex items-center justify-center flex-shrink-0"><i class="fas fa-phone text-orange text-lg"></i></div>
<div><h4 class="font-bold">Phone</h4><p class="text-gray-500 text-sm mt-1">+91 9279509297</p><p class="text-gray-500 text-sm">Mon - Sat, 9:00 AM - 7:00 PM</p></div>
</div>
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex items-start gap-4 hover:shadow-md transition">
<div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center flex-shrink-0"><i class="fas fa-envelope text-blue-500 text-lg"></i></div>
<div><h4 class="font-bold">Email</h4><p class="text-gray-500 text-sm mt-1">Service@majdoors.com</p></div>
</div>
<div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex items-start gap-4 hover:shadow-md transition">
<div class="w-12 h-12 bg-green-50 rounded-xl flex items-center justify-center flex-shrink-0"><i class="fas fa-map-marker-alt text-green-500 text-lg"></i></div>
<div><h4 class="font-bold">Office Address</h4><p class="text-gray-500 text-sm mt-1">Near Digital Duniya, Nala Road, Bihar Sharif, Nalanda, Bihar, India</p></div>
</div>

<!-- Social Links -->
<div class="bg-gradient-to-r from-orange-50 to-orange-100 rounded-2xl p-6 border border-orange-200">
<h4 class="font-bold mb-3">Follow Us</h4>
<div class="flex gap-3">
<a href="#" class="w-10 h-10 bg-white rounded-xl flex items-center justify-center hover:bg-orange-500 hover:text-white transition shadow-sm"><i class="fab fa-facebook-f"></i></a>
<a href="#" class="w-10 h-10 bg-white rounded-xl flex items-center justify-center hover:bg-orange-500 hover:text-white transition shadow-sm"><i class="fab fa-instagram"></i></a>
<a href="#" class="w-10 h-10 bg-white rounded-xl flex items-center justify-center hover:bg-orange-500 hover:text-white transition shadow-sm"><i class="fab fa-linkedin-in"></i></a>
<a href="#" class="w-10 h-10 bg-white rounded-xl flex items-center justify-center hover:bg-orange-500 hover:text-white transition shadow-sm"><i class="fab fa-x-twitter"></i></a>
<a href="#" class="w-10 h-10 bg-white rounded-xl flex items-center justify-center hover:bg-orange-500 hover:text-white transition shadow-sm"><i class="fab fa-youtube"></i></a>
</div>
</div>
</div>
</div>
</div>

    </main>
    <div id="footer-container"></div>
    <script src="js/api.js?v=15"></script>
    <script src="js/main.js?v=15"></script>
    <script src="js/app.js?v=15"></script>
    <script src="js/pages.js?v=15"></script>
</body>
</html>
